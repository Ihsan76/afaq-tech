name: Restore Test

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"

concurrency:
  group: restore-test
  cancel-in-progress: false

env:
  BACKUP_BUCKET: afaq-backups

jobs:
  verify:
    name: Download latest + verify archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install postgres client (v17 to match server)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      - name: Find latest backup
        id: latest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          LIST=$(curl -sS -X POST "$SUPABASE_URL/storage/v1/object/list/$BACKUP_BUCKET" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"prefix":"backups/","limit":5,"offset":0,"sortBy":{"column":"created_at","order":"desc"}}')
          NAME=$(echo "$LIST" | jq -r '[.[] | select(.name != null and .name != "")] | .[0].name')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Latest: $NAME"

      - name: Download latest dump
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sS -L "$SUPABASE_URL/storage/v1/object/$BACKUP_BUCKET/backups/${{ steps.latest.outputs.name }}" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -o latest.dump
          ls -lh latest.dump

      - name: Verify archive integrity (pg_restore --list)
        run: |
          PGRS=/usr/lib/postgresql/17/bin/pg_restore
          "$PGRS" --version
          "$PGRS" --list latest.dump > /dev/null
          ENTRIES=$("$PGRS" --list latest.dump | grep -vc '^;')
          echo "Archive valid — $ENTRIES TOC entries"

      - name: Verify key tables exist
        run: |
          /usr/lib/postgresql/17/bin/pg_restore --list latest.dump | grep -E "TABLE (users_user|pages_page|core_translationkey|schools_school)" | head
