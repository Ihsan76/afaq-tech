name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.testing
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check apps tests config --exclude "*migrations*"
      - name: Django system check
        run: python manage.py check
      - name: Pytest
        run: python -m pytest tests/

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8003/api/v1

  qa:
    name: Frontend QA (10 locales / RTL / SSR SEO)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8003/api/v1
      - name: Start server
        run: |
          npx next start -p 3100 &
          node -e "
            const http = require('http');
            const deadline = Date.now() + 120000;
            (function ping() {
              http.get('http://localhost:3100/en', (res) => { res.resume(); process.exit(0); })
                .on('error', () => {
                  if (Date.now() > deadline) { console.error('server did not start'); process.exit(1); }
                  setTimeout(ping, 1000);
                });
            })();
          "
      - name: Run QA smoke test (10 locales, RTL/LTR, hreflang, OG, JSON-LD, mobile)
        run: node tests/qa/smoke.mjs

  security:
    name: Security scan (pip-audit + bandit + npm audit + gitleaks + check --deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=v8.18.4
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Gitleaks (secret scanning on git history)
        run: ./gitleaks detect --source . --log-opts="--all" --no-banner

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend deps
        run: pip install -r backend/requirements-dev.txt

      - name: pip-audit (Python dependency vulnerabilities)
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Bandit (Python SAST)
        working-directory: backend
        run: |
          pip install bandit
          bandit -r apps -x "apps/*/migrations" -q -s B105,B106,B110,B310,B311,B404,B603

      - name: Django deploy checks
        working-directory: backend
        run: |
          DJANGO_SETTINGS_MODULE=config.settings.production DJANGO_SECRET_KEY=dummy-check-only python manage.py check --deploy 2>&1 | grep -viE "warning|warning:|system check identified" || true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (Node dependency vulnerabilities)
        working-directory: frontend
        # Known open issue: next@16.2.x bundles sharp <0.35.0 with libvips CVEs
        # (CVE-2026-33327/8, CVE-2026-35590/1). Fix requires upgrading next to
        # 16.3.1 (outside declared range) — track in docs/security-reports.
        continue-on-error: true
        run: npm audit --audit-level=high
