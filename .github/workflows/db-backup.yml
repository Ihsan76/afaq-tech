name: Database Backup

on:
  schedule:
    - cron: "20 1 * * *"
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

env:
  BACKUP_BUCKET: afaq-backups
  RETENTION: 14

jobs:
  backup:
    name: pg_dump -> Supabase Storage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install postgres client (v17 to match server)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      - name: pg_dump (custom format, gzip) via session pooler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          url="$DATABASE_URL"
          url="${url#*://}"
          creds="${url%%@*}"
          rest="${url#*@}"
          hostport="${rest%%/*}"
          db="${rest#*/}"
          host="${hostport%:*}"
          port="${hostport##*:}"
          user="${creds%%:*}"
          pass="${creds#*:}"
          [ "$port" = "6543" ] && port=5432
          export PGHOST="$host" PGPORT="$port" PGUSER="$user" PGPASSWORD="$pass" PGDATABASE="${db%%\?*}" PGSSLMODE=require
          TS=$(date -u +%Y%m%d_%H%M%S)
          pg_dump --format=custom --no-owner --no-privileges \
            --compress=9 --file="afaq_${TS}.dump"
          ls -lh afaq_*.dump
          echo "DUMP_FILE=afaq_${TS}.dump" >> "$GITHUB_ENV"

      - name: Upload to Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sS -X POST "$SUPABASE_URL/storage/v1/object/$BACKUP_BUCKET/$(date -u +%Y/%m)/$DUMP_FILE" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$DUMP_FILE" \
            -w "\nupload_http=%{http_code}\n"
          echo "Uploaded: $DUMP_FILE"

      - name: Retention cleanup (keep last $RETENTION)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          LIST=$(curl -sS -X POST "$SUPABASE_URL/storage/v1/object/list/$BACKUP_BUCKET" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"prefix":"","limit":1000,"offset":0,"sortBy":{"column":"created_at","order":"desc"}}')
          TOTAL=$(echo "$LIST" | jq 'length')
          echo "total backups: $TOTAL"
          if [ "$TOTAL" -gt "$RETENTION" ]; then
            echo "$LIST" | jq -c --argjson keep "$RETENTION" '{prefixes: [.[$keep:][].name]}' | \
              curl -sS -X DELETE "$SUPABASE_URL/storage/v1/object/$BACKUP_BUCKET" \
                -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Content-Type: application/json" \
                --data-binary @- \
                -w "\ndelete_http=%{http_code}\n"
          fi

# GitHub caches workflow triggers; this commit forces a fresh read.
