name: Database Backup

on:
  schedule:
    - cron: "20 1 * * *"
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

env:
  BACKUP_BUCKET: afaq-backups
  RETENTION: 14

jobs:
  backup:
    name: pg_dump -> Supabase Storage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install postgres client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: pg_dump (custom format, gzip) via session pooler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          export $(python3 - <<'EOF'
import os, re, urllib.parse
url = os.environ["DATABASE_URL"]
m = re.match(r'postgres(?:ql)?://(?:([^:]+):([^@]*)@)?([^:]+)(?::(\d+))?/(.+)', url)
user, pw, host, port, db = m.group(1) or "postgres", m.group(2) or "", m.group(3), m.group(4), m.group(5)
db = db.split("?")[0]
port = "5432" if port in (None, "6543") else port  # session pooler for pg_dump
print(f"PGHOST={host}")
print(f"PGPORT={port}")
print(f"PGUSER={user}")
print(f"PGPASSWORD={pw}")
print(f"PGDATABASE={db}")
print("PGSSLMODE=require")
EOF
          )
          TS=$(date -u +%Y%m%d_%H%M%S)
          pg_dump --format=custom --no-owner --no-privileges \
            --compress=9 --file="afaq_${TS}.dump"
          ls -lh afaq_*.dump
          echo "DUMP_FILE=afaq_${TS}.dump" >> "$GITHUB_ENV"

      - name: Upload to Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sS -X POST "$SUPABASE_URL/storage/v1/object/$BACKUP_BUCKET/$(date -u +%Y/%m)/$DUMP_FILE" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$DUMP_FILE" \
            -w "\nupload_http=%{http_code}\n"
          echo "Uploaded: $DUMP_FILE"

      - name: Retention cleanup (keep last $RETENTION)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          LIST=$(curl -sS -X POST "$SUPABASE_URL/storage/v1/object/list/$BACKUP_BUCKET" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"prefix":"","limit":1000,"offset":0,"sortBy":{"column":"created_at","order":"desc"}}')
          TOTAL=$(echo "$LIST" | jq 'length')
          echo "total backups: $TOTAL"
          if [ "$TOTAL" -gt "$RETENTION" ]; then
            echo "$LIST" | jq -c --argjson keep "$RETENTION" '{prefixes: [.[$keep:][].name]}' | \
              curl -sS -X DELETE "$SUPABASE_URL/storage/v1/object/$BACKUP_BUCKET" \
                -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Content-Type: application/json" \
                --data-binary @- \
                -w "\ndelete_http=%{http_code}\n"
          fi

# GitHub caches workflow triggers; this commit forces a fresh read.
